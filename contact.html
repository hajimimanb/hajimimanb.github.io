<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="李松展 · 联系方式">
<title>联系方式 · Contact · 李松展</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .lang-switch { display: flex; gap: 2px; margin-left: 6px; }
  .lang-switch button { font: 600 12.5px "Inter","Noto Sans SC",sans-serif; color: var(--muted); background: none; border: 1px solid var(--line); padding: 4px 10px; cursor: pointer; border-radius: 4px; }
  .lang-switch button.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  .nav-links a.active { color: var(--ink); border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
  .nav-links { align-items: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<nav class="topnav">
  <div class="container nav-inner">
    <span class="nav-name"><span class="zh">李松展</span><span class="en" hidden>Li Songzhan</span></span>
    <div class="nav-links" id="navLinks">
      <a href="index.html"><span class="zh">首页</span><span class="en" hidden>Home</span></a>
      <a href="education.html"><span class="zh">本科成绩</span><span class="en" hidden>Education</span></a>
      <a href="research.html"><span class="zh">学术研究</span><span class="en" hidden>Research</span></a>
      <a href="publications.html"><span class="zh">科研成果</span><span class="en" hidden>Publications</span></a>
      <a href="honors.html"><span class="zh">荣誉</span><span class="en" hidden>Honors</span></a>
      <a href="contact.html" class="active"><span class="zh">联系</span><span class="en" hidden>Contact</span></a>
      <div class="lang-switch"><button data-lang="zh" class="on">中文</button><button data-lang="en">EN</button></div>
    </div>
    <button class="nav-toggle" aria-label="菜单" onclick="document.getElementById('navLinks').classList.toggle('open')">≡</button>
  </div>
</nav>

<main class="container">
  <section class="section">
    <h2 class="sec-title"><span class="sec-no">06</span><span class="zh">联系方式</span><span class="en" hidden>Contact</span></h2>
    <div class="contact">
      <p>Email：<a href="mailto:xxx@xxx.com">xxx@xxx.com</a></p>
      <p>GitHub：<a href="https://github.com/hajimimanb" rel="noopener" target="_blank">github.com/hajimimanb</a></p>
      <p class="muted small"><span class="zh">欢迎交流科研与合作；有意深入了解项目可查看 GitHub 上的可运行代码。</span><span class="en" hidden>Open to research collaboration; runnable code is available on my GitHub.</span></p>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <p>© 2026 <span class="zh">李松展</span><span class="en" hidden>Songzhan Li</span> · <span class="zh">哈尔滨工业大学</span><span class="en" hidden>HIT</span></p>
  </div>
</footer>

<script>
  function setLang(l) {
    var lan = l === 'en' ? 'en' : 'zh-CN';
    document.documentElement.lang = lan;
    document.querySelectorAll('.zh').forEach(function (e) { e.hidden = (l !== 'zh'); });
    document.querySelectorAll('.en').forEach(function (e) { e.hidden = (l !== 'en'); });
    document.querySelectorAll('.lang-switch button').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === l); });
    try { localStorage.setItem('siteLang', l); } catch (e) {}
    document.getElementById('navLinks').classList.remove('open');
  }
  document.querySelectorAll('.lang-switch button').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); }); });
  var saved = 'zh'; try { saved = localStorage.getItem('siteLang') || 'zh'; } catch (e) {}
  setLang(saved === 'en' ? 'en' : 'zh');
</script>
</body>
</html>
